<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Simultáneo EN-ES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ecf0f1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(22, 33, 62, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            padding: 30px;
            border: 1px solid rgba(236, 240, 241, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            font-size: 14px;
            color: #bdc3c7;
        }
        .mic-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border: none;
            cursor: pointer;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }
        .mic-button:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.5);
        }
        .mic-button.active {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3); }
            50% { box-shadow: 0 10px 30px rgba(255, 107, 107, 0.6); }
        }
        .status {
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            height: 20px;
            color: #00d4ff;
        }
        .transcript-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .transcript {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            min-height: 150px;
            overflow-y: auto;
        }
        .transcript h3 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .transcript p {
            font-size: 15px;
            line-height: 1.6;
            color: #ecf0f1;
            word-wrap: break-word;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-clear {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }
        .btn-clear:hover {
            background: rgba(255, 107, 107, 0.3);
        }
        .btn-copy {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            border: 1px solid #00d4ff;
        }
        .btn-copy:hover {
            background: rgba(0, 212, 255, 0.3);
        }
        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            color: #ff9a9a;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 Traductor</h1>
            <p>Inglés → Español en tiempo real</p>
        </div>
        <button class="mic-button" id="micButton" title="Presiona para grabar">🎙️</button>
        <div class="status" id="status"></div>
        <div class="transcript-section">
            <div class="transcript">
                <h3>English</h3>
                <p id="englishText">Presiona el micrófono...</p>
            </div>
            <div class="transcript">
                <h3>Español</h3>
                <p id="spanishText">Tu traducción aparecerá aquí</p>
            </div>
        </div>
        <div class="controls">
            <button class="btn-clear" id="clearBtn">Limpiar</button>
            <button class="btn-copy" id="copyBtn">Copiar</button>
        </div>
        <div id="error"></div>
    </div>
    <script>
        const micButton = document.getElementById('micButton');
        const englishText = document.getElementById('englishText');
        const spanishText = document.getElementById('spanishText');
        const statusDiv = document.getElementById('status');
        const errorDiv = document.getElementById('error');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        let recognition;
        let isListening = false;
        let currentEnglish = '';
        let currentSpanish = '';
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            errorDiv.innerHTML = '<strong>Error:</strong> Tu navegador no soporta reconocimiento de voz.';
            micButton.disabled = true;
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.onstart = () => {
                isListening = true;
                micButton.classList.add('active');
                statusDiv.textContent = 'Escuchando...';
                errorDiv.innerHTML = '';
            };
            recognition.onresult = async (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i].transcript;
                    if (event.results[i].isFinal) {
                        currentEnglish += (currentEnglish ? ' ' : '') + transcript;
                    } else {
                        interim += transcript;
                    }
                }
                englishText.textContent = currentEnglish + interim || 'Presiona el micrófono...';
                if (currentEnglish) {
                    await translateText(currentEnglish);
                }
            };
            recognition.onerror = (event) => {
                statusDiv.textContent = '';
                errorDiv.innerHTML = `<strong>Error:</strong> ${event.error}`;
            };
            recognition.onend = () => {
                isListening = false;
                micButton.classList.remove('active');
                statusDiv.textContent = '';
            };
        }
        async function translateText(text) {
            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|es`);
                const data = await response.json();
                if (data.responseStatus === 200) {
                    currentSpanish = data.responseData.translatedText;
                    spanishText.textContent = currentSpanish;
                    speakSpanish(currentSpanish);
                }
            } catch (error) {
                console.error('Error en traducción:', error);
            }
        }
        function speakSpanish(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 1;
            utterance.pitch = 1;
            utterance.volume = 1;
            window.speechSynthesis.speak(utterance);
        }
        micButton.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });
        clearBtn.addEventListener('click', () => {
            currentEnglish = '';
            currentSpanish = '';
            englishText.textContent = 'Presiona el micrófono...';
            spanishText.textContent = 'Tu traducción aparecerá aquí';
            window.speechSynthesis.cancel();
        });
        copyBtn.addEventListener('click', () => {
            const text = `EN: ${currentEnglish}\nES: ${currentSpanish}`;
            navigator.clipboard.writeText(text).then(() => {
                copyBtn.textContent = '✓ Copiado';
                setTimeout(() => {
                    copyBtn.textContent = 'Copiar';
                }, 2000);
            });
        });
    </script>
</body>
</html>
